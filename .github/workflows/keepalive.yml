name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://questy-api.onrender.com/api/health)
          echo "Health check responded with HTTP $status"
          if [ "$status" != "200" ]; then
            exit 1
          fi
